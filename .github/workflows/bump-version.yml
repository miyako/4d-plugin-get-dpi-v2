# Commits source metadata only; run Build separately on the selected branch.
name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: bump-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: validate and commit source version
        id: bump
        env:
          MODE: ${{ inputs.mode }}
          SELECTED_SHA: ${{ github.sha }}
          SELECTED_REF: ${{ github.ref }}
        run: python3 .github/scripts/lifecycle.py bump --mode "$MODE" --sha "$SELECTED_SHA" --ref "$SELECTED_REF"

      - name: summary
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: echo "### Source bumped to v${VERSION}. No tag or build created. Run Build separately on this branch." >> "$GITHUB_STEP_SUMMARY"
